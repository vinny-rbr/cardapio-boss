<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio Boss · Formatura PM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pagina">
    <div class="moldura">
      <span class="canto canto-tl"></span>
      <span class="canto canto-tr"></span>
      <span class="canto canto-bl"></span>
      <span class="canto canto-br"></span>

      <header class="cabecalho">
        <div class="emblema">
          <svg width="62" height="62" viewBox="0 0 100 100" fill="none" aria-hidden="true">
            <circle cx="50" cy="50" r="40" stroke="#d9b25b" stroke-width="1" opacity=".45"></circle>
            <circle cx="50" cy="50" r="33" stroke="#d9b25b" stroke-width="2"></circle>
            <path d="M50 27 L56.5 43.5 L74 44.5 L60 55.5 L65 72 L50 61.5 L35 72 L40 55.5 L26 44.5 L43.5 43.5 Z" fill="#d9b25b"></path>
            <circle cx="50" cy="50" r="46" stroke="#d9b25b" stroke-width="1" stroke-dasharray="2 5" opacity=".5"></circle>
          </svg>
        </div>
        <div class="subtitulo">FORMATURA · POLÍCIA MILITAR</div>
        <h1>Cardápio Boss</h1>
        <div class="divisor"><span class="linha"></span><span class="estrela">★</span><span class="linha"></span></div>
        <p class="lema">Turma 2026 · Boss Bar — drinks da noite de honra</p>
      </header>

      <label class="busca">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#d9b25b" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
        <input type="text" id="pesquisa" placeholder="Buscar drink ou ingrediente…">
      </label>

      <div class="filtros">
        <button class="ativo" type="button" onclick="filtrar('todos', this)">Todos</button>
        <button type="button" onclick="filtrar('alcool', this)">Com álcool</button>
        <button type="button" onclick="filtrar('sem', this)">Sem álcool</button>
      </div>
      <div class="contagem" id="contagem"></div>

      <main id="cardapio" class="lista"></main>

      <div class="rodape">★ &nbsp; HONRA · DISCIPLINA · CELEBRAÇÃO &nbsp; ★</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

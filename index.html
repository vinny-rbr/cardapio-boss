<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio Boss</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pagina">
    <div class="moldura">
      <span class="canto canto-tl"></span>
      <span class="canto canto-tr"></span>
      <span class="canto canto-bl"></span>
      <span class="canto canto-br"></span>

      <header class="cabecalho">
        <div class="ornamento">❖ ❖ ❖</div>
        <h1>Cardápio<br>Boss</h1>
        <div class="subtitulo">BOSS BAR · SPEAKEASY</div>
        <p class="lema">Receitas de drinks, com e sem álcool — feitas pra mandar bem no balcão.</p>
      </header>

      <label class="busca">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#d9b25b" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
        <input type="text" id="pesquisa" placeholder="Buscar drink ou ingrediente…">
      </label>

      <div class="filtros">
        <button class="ativo" type="button" onclick="filtrar('todos', this)">Todos</button>
        <button type="button" onclick="filtrar('alcool', this)">Com álcool</button>
        <button type="button" onclick="filtrar('sem', this)">Sem álcool</button>
      </div>
      <div class="contagem" id="contagem"></div>

      <main id="cardapio" class="lista"></main>

      <div class="ornamento rodape">❖ ❖ ❖</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
